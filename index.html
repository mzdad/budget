<!doctype html>
<html lang="da">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="#1f7a5a">

	<!-- Puts on the colours chosen under Indstillinger -> Udseende before anything is drawn, so the
	     page never flashes in the other colours. app.js does the choosing; this only reads it. -->
	<script>
		try {
			var savedTheme = localStorage.getItem("budget.theme");
			if (/^[a-z]{1,20}$/.test(savedTheme) && savedTheme !== "green") {
				document.documentElement.setAttribute("data-theme", savedTheme);
			}
		} catch (error) {
			// No saved choice: the normal colours.
		}
	</script>
	<title>Månedsbudget</title>

	<!-- Lets an iPhone or Android phone put the page on the home screen like an app. -->
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="apple-touch-icon" href="icon-180.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Budget">

	<link rel="stylesheet" href="style.css?v=1.17.0">
</head>
<body>

	<!-- The month switcher stays at the top while you scroll. -->
	<header class="top">
		<button class="step" data-action="previous-month" aria-label="Forrige måned" data-i18n-aria="Forrige måned">‹</button>
		<div class="month">
			<span id="month-label"></span>
			<button id="this-month" class="link" data-action="this-month" data-i18n="Gå til denne måned" hidden>Gå til denne måned</button>
		</div>
		<button class="step" data-action="next-month" aria-label="Næste måned" data-i18n-aria="Næste måned">›</button>
	</header>

	<!-- app.js fills this in when something can't be saved, and hides it again. -->
	<p id="save-warning" class="warning" hidden></p>

	<!-- "Gemt på kontoen" - only shown when signed in. -->
	<p id="sync-status" class="sync-status" role="status" hidden></p>

	<!-- app.js draws the chosen screen in here. -->
	<main id="view"></main>

	<footer class="app-footer">
		<p id="app-version"></p>
	</footer>

	<nav class="tabs" aria-label="Skærme" data-i18n-aria="Skærme">
		<button data-tab="overview" data-i18n="Overblik">Overblik</button>
		<button data-tab="expenses" data-i18n="Udgifter">Udgifter</button>
		<button data-tab="future" data-i18n="Fremtid">Fremtid</button>
		<button data-tab="plan" data-i18n="Plan">Plan</button>
		<button data-tab="settings" class="gear" aria-label="Indstillinger" title="Indstillinger" data-i18n-aria="Indstillinger" data-i18n-title="Indstillinger">&#9881;&#xFE0E;</button>
	</nav>

	<!-- Our own files (these, and style.css at the top) end in ?v=1.17.0. That number is the
	     version shown at the bottom of the page, and it is what makes phones fetch new files after
	     a release instead of mixing new and old ones from their cache. Change it on every release:
	     python dev_set_version.py 1.3.0  (see README). -->
	<script src="texts.js?v=1.17.0"></script>
	<script src="budget.js?v=1.17.0"></script>
	<script src="firebase-config.js?v=1.17.0"></script>
	<script src="password.js?v=1.17.0"></script>
	<script src="account.js?v=1.17.0"></script>
	<script src="kid.js?v=1.17.0"></script>
	<script src="scan.js?v=1.17.0"></script>
	<script src="app.js?v=1.17.0"></script>
</body>
</html>
